<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SharpAcademy — изучение C# и .NET</title>
  <meta name="description" content="Платформа для изучения C# и backend .NET: теория, примеры, практические задачи и подготовка к интервью.">
  <script>try{var t=localStorage.getItem('sharpacademy_theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Print: только сертификат */
    @media print {
      body::before, body::after, .navbar, .footer, .page-head, .cert-wrap > div:first-child { display: none !important; }
      body { background: #fff; }
      main { padding: 0 !important; }
      .certificate { box-shadow: none; border-color: #7c3aed; break-inside: avoid; }
      .certificate, .cert-title, .cert-name, .prose, .cert-meta, .cert-eyebrow { color: #1a1a2e !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .cert-name { -webkit-text-fill-color: #7c3aed; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <a href="#/" class="brand">
        <span class="brand-logo">♯</span>
        <span>Sharp<span class="hl">Academy</span></span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="#/" class="nav-link" data-route="home">Главная</a>
        <a href="#/course" class="nav-link" data-route="course">Курс</a>
        <a href="#/tests" class="nav-link" data-route="tests">Тесты</a>
        <a href="#/interview" class="nav-link" data-route="interview">Интервью</a>
        <a href="#/certificate" class="nav-link" data-route="certificate">Сертификат</a>
      </div>
      <div class="nav-right">
        <button class="theme-toggle" id="themeToggle" title="Сменить тему">☀️</button>
        <span class="xp-chip"><span class="ic">⭐</span><span id="navXp">0 XP</span></span>
        <span class="streak-chip"><span class="ic">🔥</span><span id="navStreak">1🔥</span></span>
        <span id="authSlot"></span>
        <button class="burger" id="burger">☰</button>
      </div>
    </div>
  </nav>

  <main id="app"></main>

  <footer class="footer">
    <div class="container">
      <div class="brand"><span class="brand-logo" style="width:30px;height:30px;font-size:1rem">♯</span> SharpAcademy</div>
      <div>Платформа для изучения C# и .NET · сделано с ❤️ для будущих backend-разработчиков</div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/data-csharp.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
